name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint et tests Node (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  database:
    name: Base de données (Supabase local, pgTAP)
    runs-on: ubuntu-latest
    env:
      # Base locale jetable (Docker) : identifiants par défaut de la CLI, aucun secret.
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      # `supabase start` applique les migrations de supabase/migrations/ (baseline puis suivantes).
      - name: Démarrer Supabase local (applique les migrations)
        run: supabase start
      - name: Activer pgTAP
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -c "create extension if not exists pgtap with schema extensions"
      - name: Tests pgTAP (RLS, triggers, alertes_stock)
        run: supabase test db
      - name: Fusion des doublons de medicaments (données synthétiques, tout est annulé)
        env:
          DATABASE_URL: ${{ env.DB_URL }}
        run: scripts/test-fusion.sh
      - name: L'inventaire attendu correspond aux migrations
        run: |
          psql "$DB_URL" -X -q --csv -f supabase/diagnostics/schema_inventory.sql > "$RUNNER_TEMP/inventory.csv"
          node scripts/compare-schema.js "$RUNNER_TEMP/inventory.csv"
      - name: Script de vérification post-migrations (docs/MISE-EN-PRODUCTION.md, phase D)
        run: |
          psql "$DB_URL" -X -A -t -F'|' -f supabase/diagnostics/verification_post_migrations.sql > "$RUNNER_TEMP/verification.txt"
          grep -E '\|f$' "$RUNNER_TEMP/verification.txt" || true
          # Le stockage est désactivé en local (config.toml) : le seul contrôle du bucket ne peut pas s'y vérifier.
          # Il reste actif en production. Tout autre échec fait échouer l'étape.
          ! grep -E '\|f$' "$RUNNER_TEMP/verification.txt" | grep -v -e '^0|BILAN|' -e 'bucket documents-demandes présent et PRIVÉ'
      - name: Arrêter Supabase local
        if: always()
        run: supabase stop --no-backup
