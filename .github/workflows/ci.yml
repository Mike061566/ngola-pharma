name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Lint et tests Node (${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  database:
    name: Base de données (Supabase local, pgTAP)
    runs-on: ubuntu-latest
    env:
      # Base locale jetable (Docker) : identifiants par défaut de la CLI, aucun secret.
      DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Démarrer Supabase local
        run: supabase start
      - name: Appliquer le schéma de référence
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -q -f supabase/setup_consolide.sql
      - name: Activer pgTAP
        run: psql "$DB_URL" -v ON_ERROR_STOP=1 -c "create extension if not exists pgtap with schema extensions"
      - name: Tests pgTAP (RLS, triggers, alertes_stock)
        run: supabase test db
      - name: La baseline correspond au schéma de référence
        run: |
          psql "$DB_URL" -X -q --csv -f supabase/diagnostics/schema_inventory.sql > "$RUNNER_TEMP/inventory.csv"
          node scripts/compare-schema.js "$RUNNER_TEMP/inventory.csv"
      - name: Arrêter Supabase local
        if: always()
        run: supabase stop --no-backup
